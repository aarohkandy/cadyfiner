[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadyfiner"
version = "0.1.0"
description = "A CAD prompt refiner: rewrites underspecified CAD prompts for more reliable generated geometry, with an evidence-driven automated quality oracle and exit-criteria test harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.8",
    "trimesh>=4.0",
    "scipy>=1.10",
    "pydantic>=2",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
frontier = ["anthropic>=0.25"]
judge = ["matplotlib>=3.8", "pyglet<2"]
trained = ["torch>=2.0", "transformers>=4.40", "peft>=0.11"]
train = ["torch>=2.0", "transformers>=4.40", "peft>=0.11", "trl>=0.9", "datasets>=2.19", "accelerate>=0.30"]
test = ["pytest>=8"]

[project.scripts]
cadyfiner = "cadyfiner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cadyfiner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
